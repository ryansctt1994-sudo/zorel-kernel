name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  receipt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9"

      - name: Run receipt tests
        run: python -m pytest -q tests

  claim-audit:
    # Fails on any blocked term (production-ready, validated, safe, ASI, ...)
    # that claims.json neither backs with evidence nor waives with a reason.
    # The auditor is governance.claim_audit from Weaver--Cathedral-, pinned to
    # a commit; bump AUDITOR_REF to update it.
    runs-on: ubuntu-latest
    env:
      AUDITOR_REF: cd34963b48fd05c47c9b4513fda5960a068c2fdc
    steps:
      - uses: actions/checkout@v4

      - name: Check out the claim auditor
        uses: actions/checkout@v4
        with:
          repository: ryansctt1994-sudo/Weaver--Cathedral-
          ref: ${{ env.AUDITOR_REF }}
          path: .claim-auditor

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install auditor dependency
        run: python -m pip install "pydantic>=2.7,<3"

      - name: Audit claims
        run: python .claim-auditor/skills/governance/claim_audit/claim_audit.py . --json claim-audit-report.json

      - name: Upload claim audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-audit-report
          path: claim-audit-report.json
